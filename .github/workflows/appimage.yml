name: Build Wyrd AppImage

on:
  workflow_dispatch:
  push:
    branches: [feature/mo2-environments]
    paths:
      - "qt-ui/**"
      - "packaging/**"
      - ".github/workflows/appimage.yml"

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out Wyrd
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qt-ui/requirements.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2 patchelf desktop-file-utils file wget
          python -m pip install --upgrade pip
          python -m pip install -r qt-ui/requirements.txt pyinstaller

      - name: Build standalone application bundle
        working-directory: qt-ui
        run: pyinstaller --noconfirm --clean Wyrd.spec

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/scalable/apps
          cp qt-ui/dist/Wyrd AppDir/usr/bin/Wyrd
          cp packaging/wyrd.svg AppDir/usr/share/icons/hicolor/scalable/apps/wyrd.svg
          cp packaging/wyrd.desktop AppDir/wyrd.desktop
          cp packaging/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/Wyrd
          desktop-file-validate AppDir/wyrd.desktop

      - name: Build AppImage
        run: |
          set -euo pipefail
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir Wyrd-x86_64.AppImage

      - name: Verify artifact
        run: |
          file Wyrd-x86_64.AppImage
          test -s Wyrd-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Wyrd-x86_64-AppImage
          path: Wyrd-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
