name: Wyrd tests and release bundle

on:
  push:
    branches: [main, v1/mo2, v1/Please-god]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install Qt dependencies
        run: python -m pip install -r qt-ui/requirements.txt
      - name: Verify Qt application imports
        working-directory: qt-ui
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -c "from PySide6.QtWidgets import QApplication; import main; print('Qt application imports successfully')"
      - name: Python compile checks
        run: python3 -m compileall -q qt-ui
      - name: Python unit tests
        run: python3 -m unittest discover -s qt-ui/tests -p 'test_*.py'
      - name: Qt offscreen smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s qt-ui/tests -p 'test_main_window.py'
      - name: Shell syntax checks
        run: |
          bash -n qt-ui/run.sh
          bash -n qt-ui/install-desktop-launcher.sh

  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source release bundle
        run: |
          bundle="$RUNNER_TEMP/wyrd-qt6-source.tar.gz"
          tar --exclude=.git --exclude=qt-ui/.venv --exclude='*/__pycache__' --exclude=./dist --exclude=./dist/ -czf "$bundle" .
      - uses: actions/upload-artifact@v4
        with:
          name: wyrd-qt6-source
          path: ${{ runner.temp }}/wyrd-qt6-source.tar.gz
          if-no-files-found: error
